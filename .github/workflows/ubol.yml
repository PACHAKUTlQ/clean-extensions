name: Build uBlock Origin Lite

on:
  schedule:
    - cron: "36 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build uBlock Origin Lite
    uses: ./.github/workflows/build-extension.yml
    with:
      extension: ubol
      title: uBlock Origin Lite
      repository: uBlockOrigin/uBOL-home
      submodules: true
      resolve: |
        tag=$(gh api \
          "repos/$UPSTREAM_REPOSITORY/releases/latest" \
          --jq '.tag_name')
        version=${tag#v}

        encoded_tag=$(jq -rn --arg tag "$tag" '$tag | @uri')
        revision=$(gh api \
          "repos/$UPSTREAM_REPOSITORY/commits/$encoded_tag" \
          --jq '.sha')

        {
          echo "version=$version"
          echo "revision=$revision"
          echo "upstream_tag=$tag"
        } >> "$GITHUB_OUTPUT"
      build: |
        cd uBlock
        git submodule update --init --recursive

        codemirror="platform/mv3/extension/lib/codemirror/codemirror-ubol"

        (
          cd "$codemirror"

          npm install
          npm run build
        )

        bundle="$codemirror/dist/cm6.bundle.ubol.min.js"

        if [[ ! -s "$bundle" ]]; then
          echo "Error: CodeMirror build did not produce $bundle." >&2
          exit 1
        fi

        bash tools/make-mv3.sh chromium "$UPSTREAM_TAG"

        echo "path=$PWD/dist/build/uBOLite_$UPSTREAM_TAG.chromium.zip" \
          >> "$GITHUB_OUTPUT"
