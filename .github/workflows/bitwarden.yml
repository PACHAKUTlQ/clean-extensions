name: Build Bitwarden

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Bitwarden
    uses: ./.github/workflows/build-extension.yml
    with:
      extension: bitwarden
      title: Bitwarden
      repository: bitwarden/clients
      resolve: |
        tags=$(gh api --paginate \
          "repos/$UPSTREAM_REPOSITORY/releases?per_page=100" \
          --jq '.[] |
            select(.draft == false and .prerelease == false) |
            select(.tag_name | startswith("browser-")) |
            .tag_name')

        tag=$(awk 'NR == 1 { print; exit }' <<< "$tags")
        [[ -n "$tag" ]]
        version=${tag#browser-}

        encoded_tag=$(jq -rn --arg tag "$tag" '$tag | @uri')
        revision=$(gh api \
          "repos/$UPSTREAM_REPOSITORY/commits/$encoded_tag" \
          --jq '.sha')

        {
          echo "version=$version"
          echo "revision=$revision"
          echo "upstream_tag=$tag"
        } >> "$GITHUB_OUTPUT"
      build: |
        patch --batch --forward --fuzz=0 -p1 -l \
          < "$GITHUB_WORKSPACE/extensions/bitwarden/premium.patch"

        npm ci

        cd apps/browser
        npm run dist:chrome
        echo "path=$PWD/dist/dist-chrome.zip" >> "$GITHUB_OUTPUT"
