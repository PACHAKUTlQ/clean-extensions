name: Build NoScript

on:
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build NoScript
    uses: ./.github/workflows/build-extension.yml
    with:
      extension: noscript
      title: NoScript
      node-version: ""
      resolve: |
        html=$(curl --fail --silent --show-error --location \
          --retry 3 --connect-timeout 15 --max-time 60 \
          https://noscript.net/getit/)

        download_url=$(printf '%s\n' "$html" |
          grep -oE 'https://secure\.informaction\.com/download/betas/noscript-[0-9]+(\.[0-9]+)*-chrome\.zip' |
          sort -Vu |
          tail -n 1)

        [[ -n "$download_url" ]]

        version=${download_url##*/noscript-}
        version=${version%-chrome.zip}

        {
          echo "version=$version"
          echo "download_url=$download_url"
        } >> "$GITHUB_OUTPUT"
      build: |
        echo "path=$PWD" >> "$GITHUB_OUTPUT"
