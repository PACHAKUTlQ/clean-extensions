name: Build Dark Reader

on:
  schedule:
    - cron: "24 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Dark Reader
    uses: ./.github/workflows/build-extension.yml
    with:
      extension: darkreader
      title: Dark Reader
      repository: darkreader/darkreader
      biweekly: true
      resolve: |
        tag=$(gh api \
          "repos/$UPSTREAM_REPOSITORY/releases/latest" \
          --jq '.tag_name')
        version=${tag#v}

        encoded_tag=$(jq -rn --arg tag "$tag" '$tag | @uri')
        revision=$(gh api \
          "repos/$UPSTREAM_REPOSITORY/commits/$encoded_tag" \
          --jq '.sha')

        {
          echo "version=$version"
          echo "revision=$revision"
          echo "upstream_tag=$tag"
        } >> "$GITHUB_OUTPUT"
      build: |
        if [[ -f package-lock.json ]]; then
          npm ci
        else
          npm install
        fi

        node --max-old-space-size=3072 tasks/cli.js build \
          --release --chrome-mv3

        echo "path=$PWD/build/release/darkreader-chrome-mv3.zip" \
          >> "$GITHUB_OUTPUT"
