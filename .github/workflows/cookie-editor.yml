name: Build Cookie-Editor

on:
  schedule:
    - cron: "21 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Cookie-Editor
    uses: ./.github/workflows/build-extension.yml
    with:
      extension: cookie-editor
      title: Cookie-Editor
      repository: Moustachauve/cookie-editor
      biweekly: true
      resolve: |
        revision=$(gh api \
          "repos/$UPSTREAM_REPOSITORY/commits/master" \
          --jq '.sha')

        version=$(gh api \
          "repos/$UPSTREAM_REPOSITORY/contents/package.json?ref=$revision" \
          --jq '.content' |
          base64 --decode |
          jq -er '.version')

        short_sha=${revision:0:7}

        {
          echo "version=$version-$short_sha"
          echo "revision=$revision"
        } >> "$GITHUB_OUTPUT"
      build: |
        patch --batch --forward --fuzz=2 -p1 -l \
          < "$GITHUB_WORKSPACE/extensions/cookie-editor/disable-ads.patch"

        npm ci
        npx --no-install grunt

        mapfile -d '' -t archives < <(
          find "$PWD/dist" -type f -iname '*chrome*.zip' -print0
        )

        if [[ "${#archives[@]}" != 1 ]]; then
          echo "Error: Expected exactly one Chrome ZIP." >&2
          exit 1
        fi

        echo "path=${archives[0]}" >> "$GITHUB_OUTPUT"
