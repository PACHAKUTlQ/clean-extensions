name: Build Violentmonkey

on:
  schedule:
    - cron: "39 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Violentmonkey
    uses: ./.github/workflows/build-extension.yml
    with:
      extension: violentmonkey
      title: Violentmonkey
      repository: violentmonkey/violentmonkey
      resolve: |
        tag=$(gh api \
          "repos/$UPSTREAM_REPOSITORY/releases/latest" \
          --jq '.tag_name')
        version=${tag#v}

        encoded_tag=$(jq -rn --arg tag "$tag" '$tag | @uri')
        revision=$(gh api \
          "repos/$UPSTREAM_REPOSITORY/commits/$encoded_tag" \
          --jq '.sha')

        {
          echo "version=$version"
          echo "revision=$revision"
          echo "upstream_tag=$tag"
        } >> "$GITHUB_OUTPUT"
      build: |
        npm pkg delete scripts.prepare
        npm pkg delete scripts.prebuild

        yarn install --frozen-lockfile
        yarn build

        echo "path=$PWD/dist" >> "$GITHUB_OUTPUT"
