name: Build Violentmonkey

on:
  schedule:
    - cron: "39 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Violentmonkey
    uses: ./.github/workflows/build-extension.yml
    with:
      extension: violentmonkey
      title: Violentmonkey
      repository: violentmonkey/violentmonkey
      node-version: "26"
      resolve: |
        tag=$(gh api \
          "repos/$UPSTREAM_REPOSITORY/releases/latest" \
          --jq '.tag_name')
        version=${tag#v}

        encoded_tag=$(jq -rn --arg tag "$tag" '$tag | @uri')
        revision=$(gh api \
          "repos/$UPSTREAM_REPOSITORY/commits/$encoded_tag" \
          --jq '.sha')

        {
          echo "version=$version"
          echo "revision=$revision"
          echo "upstream_tag=$tag"
        } >> "$GITHUB_OUTPUT"
      build: |
        node --input-type=module <<'JS'
        import { readFileSync, writeFileSync } from "node:fs";

        const path = "package.json";
        const manifest = JSON.parse(readFileSync(path, "utf8"));
        const manager = manifest.packageManager;

        if (typeof manager !== "string") {
          throw new Error("Missing packageManager declaration.");
        }

        if (manager.startsWith("yarn@pnpm@")) {
          manifest.packageManager = manager.slice("yarn@".length);
          writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
        }

        if (!manifest.packageManager.startsWith("pnpm@")) {
          throw new Error(`Expected pnpm, found ${manifest.packageManager}.`);
        }

        if (!manifest.scripts?.["build:mv3"]) {
          throw new Error("Missing build:mv3 script.");
        }
        JS

        npm install --global corepack
        corepack enable

        HUSKY=0 pnpm install --frozen-lockfile
        pnpm run build:mv3

        echo "path=$PWD/dist-mv3" >> "$GITHUB_OUTPUT"
