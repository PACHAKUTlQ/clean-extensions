name: Build React DevTools

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build React DevTools
    uses: ./.github/workflows/build-extension.yml
    with:
      extension: react-devtools
      title: React DevTools
      repository: react/react
      biweekly: true
      archive-root: true
      tag-prefix: ""
      resolve: |
        revision=$(gh api \
          "repos/$UPSTREAM_REPOSITORY/commits?path=packages/react-devtools-extensions&per_page=1" \
          --jq '.[0].sha')

        [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
        short_sha=${revision:0:7}

        {
          echo "version=$short_sha"
          echo "revision=$revision"
          echo "download_url=https://github.com/$UPSTREAM_REPOSITORY/archive/$revision.zip"
        } >> "$GITHUB_OUTPUT"
      build: |
        yarn install --frozen-lockfile
        yarn build-for-devtools

        cd packages/react-devtools-extensions
        yarn build:chrome

        echo "path=$PWD/chrome/build/unpacked" >> "$GITHUB_OUTPUT"
