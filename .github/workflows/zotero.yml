name: Build Zotero Connector

on:
  schedule:
    - cron: "57 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Zotero Connector
    uses: ./.github/workflows/build-extension.yml
    with:
      extension: zotero-connectors
      title: Zotero Connector
      repository: zotero/zotero-connectors
      submodules: true
      resolve: |
        tag=$(gh api \
          "repos/$UPSTREAM_REPOSITORY/tags?per_page=1" \
          --jq '.[0].name')
        version=${tag#v}

        encoded_tag=$(jq -rn --arg tag "$tag" '$tag | @uri')
        revision=$(gh api \
          "repos/$UPSTREAM_REPOSITORY/commits/$encoded_tag" \
          --jq '.sha')

        {
          echo "version=$version"
          echo "revision=$revision"
          echo "upstream_tag=$tag"
        } >> "$GITHUB_OUTPUT"
      build: |
        patch --batch --forward --fuzz=2 -p1 -l \
          < "$GITHUB_WORKSPACE/extensions/zotero-connectors/disable-telemetry.patch"

        npm ci
        bash build.sh -p b -v "$VERSION"

        echo "path=$PWD/build/manifestv3" >> "$GITHUB_OUTPUT"
