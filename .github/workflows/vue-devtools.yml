name: Build Vue DevTools

on:
  schedule:
    - cron: "42 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Vue DevTools
    uses: ./.github/workflows/build-extension.yml
    with:
      extension: vue-devtools
      title: Vue DevTools
      repository: vuejs/devtools
      biweekly: true
      resolve: |
        tag=$(gh api \
          "repos/$UPSTREAM_REPOSITORY/releases/latest" \
          --jq '.tag_name')
        version=${tag#v}

        encoded_tag=$(jq -rn --arg tag "$tag" '$tag | @uri')
        revision=$(gh api \
          "repos/$UPSTREAM_REPOSITORY/commits/$encoded_tag" \
          --jq '.sha')

        {
          echo "version=$version"
          echo "revision=$revision"
          echo "upstream_tag=$tag"
        } >> "$GITHUB_OUTPUT"
      build: |
        npm install --global corepack
        corepack enable

        pnpm install --ignore-scripts --frozen-lockfile
        pnpm build:chrome-extension

        cd packages/chrome-extension
        [[ -f manifest.json ]]

        files=(
          manifest.json
          package.json
          devtools-background.html
          devtools-panel.html
          dist
          icons
          client
          overlay
          pages
          popups
        )
        selected_files=()

        for file in "${files[@]}"; do
          if [[ -e "$file" ]]; then
            selected_files+=("$file")
          fi
        done

        archive="$RUNNER_TEMP/vue-devtools.zip"
        zip -r -q "$archive" "${selected_files[@]}"

        echo "path=$archive" >> "$GITHUB_OUTPUT"
