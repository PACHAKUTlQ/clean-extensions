name: Build ZeroOmega

on:
  schedule:
    - cron: "51 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ZeroOmega
    uses: ./.github/workflows/build-extension.yml
    with:
      extension: zeroomega
      title: ZeroOmega
      repository: zero-peak/ZeroOmega
      resolve: |
        tag=$(gh api \
          "repos/$UPSTREAM_REPOSITORY/releases/latest" \
          --jq '.tag_name')
        version=${tag#v}

        encoded_tag=$(jq -rn --arg tag "$tag" '$tag | @uri')
        revision=$(gh api \
          "repos/$UPSTREAM_REPOSITORY/commits/$encoded_tag" \
          --jq '.sha')

        {
          echo "version=$version"
          echo "revision=$revision"
          echo "upstream_tag=$tag"
        } >> "$GITHUB_OUTPUT"
      build: |
        cd omega-build

        npm run deps
        npm run dev
        npm run build
        npm run release

        directory="$GITHUB_WORKSPACE/source/omega-target-chromium-extension/tmp/chromium"

        if [[ ! -f "$directory/manifest.json" ]]; then
          echo "Error: Chromium staging directory is missing manifest.json." >&2
          exit 1
        fi

        echo "path=$directory" >> "$GITHUB_OUTPUT"
