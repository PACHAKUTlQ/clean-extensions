name: Build Wayback Machine

on:
  schedule:
    - cron: "47 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Wayback Machine
    uses: ./.github/workflows/build-extension.yml
    with:
      extension: wayback-machine
      title: Wayback Machine
      repository: internetarchive/wayback-machine-webextension
      biweekly: true
      resolve: |
        revision=$(gh api \
          "repos/$UPSTREAM_REPOSITORY/commits/master" \
          --jq '.sha')

        version=$(gh api \
          "repos/$UPSTREAM_REPOSITORY/contents/package.json?ref=$revision" \
          --jq '.content' |
          base64 --decode |
          jq -er '.version')

        short_sha=${revision:0:7}

        {
          echo "version=$version-$short_sha"
          echo "revision=$revision"
        } >> "$GITHUB_OUTPUT"
      build: |
        patch --batch --forward --fuzz=0 -p1 -l \
          < "$GITHUB_WORKSPACE/extensions/wayback-machine/enable-private-mode.patch"

        npm ci
        npm run build

        echo "path=$PWD/webextension" >> "$GITHUB_OUTPUT"
