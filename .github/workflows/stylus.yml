name: Build Stylus

on:
  schedule:
    - cron: "33 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Stylus
    uses: ./.github/workflows/build-extension.yml
    with:
      extension: stylus
      title: Stylus
      repository: openstyles/stylus
      resolve: |
        tag=$(gh api \
          "repos/$UPSTREAM_REPOSITORY/releases/latest" \
          --jq '.tag_name')
        version=${tag#v}

        encoded_tag=$(jq -rn --arg tag "$tag" '$tag | @uri')
        revision=$(gh api \
          "repos/$UPSTREAM_REPOSITORY/commits/$encoded_tag" \
          --jq '.sha')

        {
          echo "version=$version"
          echo "revision=$revision"
          echo "upstream_tag=$tag"
        } >> "$GITHUB_OUTPUT"
      build: |
        npm install --global pnpm
        pnpm install --ignore-scripts --frozen-lockfile
        PUBLISH=CWS pnpm build-chrome-mv3

        echo "path=$PWD/dist" >> "$GITHUB_OUTPUT"
